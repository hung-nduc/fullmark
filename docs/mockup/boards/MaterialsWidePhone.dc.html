<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Materials pop-up on a phone</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div style="{{rootStyle}}">
        <main style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
          <h1 style="margin: 0; font-size: 1.45em; line-height: 1.25">Signals and Systems, with materials</h1>
          <div style="font-size: 0.9em; color: {{t.muted}}">12 questions · 12 points</div>
          <div style="{{wholeRow}}">
            <span style="font-weight: 700">The whole quiz</span>
            <span style="font-size: 0.85em; color: {{t.muted}}">3 parts · 12 questions</span>
          </div>
          <button style="{{startBtn}}">Start</button>
          <button onClick="{{openPop}}" aria-haspopup="dialog" aria-expanded="{{expanded}}" style="{{secondaryBtn}}">Materials</button>
        </main>

        <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
          <div role="dialog" aria-modal="true" aria-labelledby="mp-title" style="{{sheetStyle}}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid {{t.line}}">
              <h2 id="mp-title" style="margin: 0; font-size: 1.1em">Materials</h2>
              <button onClick="{{closePop}}" style="{{secondaryBtnSmall}}">Close</button>
            </div>
            <div role="tablist" aria-label="Sheets" style="display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid {{t.line}}">
              <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
                <button role="tab" aria-selected="{{c.selected}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
              </sc-for>
            </div>
            <div role="tabpanel" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
              <h3 style="margin: 0; font-size: 1.02em">Fourier transform properties</h3>
              <div style="position: relative">
                <div tabindex="0" aria-label="Fourier transform properties, scrolls sideways" style="overflow-x: auto; padding-bottom: 6px">
                  <table style="{{table}}">
                    <thead>
                      <tr><th style="{{th}}">Property</th><th style="{{th}}">x(t)</th><th style="{{th}}">X(ω)</th><th style="{{th}}">Note</th></tr>
                    </thead>
                    <tbody>
                      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
                        <tr><td style="{{td}}">{{r.p}}</td><td style="{{tdMath}}">{{r.x}}</td><td style="{{tdMath}}">{{r.X}}</td><td style="{{td}}">{{r.n}}</td></tr>
                      </sc-for>
                    </tbody>
                  </table>
                </div>
                <div aria-hidden="true" style="{{fade}}"></div>
              </div>
              <p style="margin: 0; font-size: 0.82em; color: {{t.muted}}">Scroll sideways for the rest of the table.</p>
            </div>
          </div>
        </sc-if>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","oled","white","paper"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        renderVals() {
          var self = this;
          var s = this.state || {};
          var T = {
            light: { bg: "#eceae5", surface: "#f4f3ef", card: "#fcfcfa", line: "#d6d4cd", lineStrong: "#8c8b83", text: "#2a2b31", muted: "#55554f", accent: "#46608a", onAccent: "#fcfcfa", infoWash: "#e2e8f0" },
            dark: { bg: "#1b1d22", surface: "#262a31", card: "#2c3038", line: "#464c57", lineStrong: "#7b8394", text: "#d9dce2", muted: "#a9afba", accent: "#8fa8d4", onAccent: "#15171b", infoWash: "#243042" },
            oled: { bg: "#000000", surface: "#0e0e10", card: "#0f0f11", line: "#303238", lineStrong: "#73767e", text: "#e0e0e0", muted: "#a3a5aa", accent: "#9fb2d4", onAccent: "#000000", infoWash: "#111a26" },
            white: { bg: "#ffffff", surface: "#ffffff", card: "#ffffff", line: "#c9c9c9", lineStrong: "#767676", text: "#1a1a1a", muted: "#575757", accent: "#1f4f8f", onAccent: "#ffffff", infoWash: "#eaf1fa" },
            paper: { bg: "#f6f1e7", surface: "#efe8da", card: "#fbf8f1", line: "#dcd2bf", lineStrong: "#8b806c", text: "#37302a", muted: "#665b4e", accent: "#4c6b65", onAccent: "#fbf8f1", infoWash: "#e4e6e4" }
          };
          var t = T[this.props.theme || "dark"] || T.dark;
          var open = s.open === undefined ? true : s.open;
          var sheet = s.sheet || 0;
          var line = "1px solid " + t.line;
          var MATH = "'Cambria Math', 'Source Serif 4', Georgia, serif";
          var btn = "font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 8px; cursor: pointer; border: 2px solid " + t.lineStrong + "; background: " + t.card + "; color: " + t.text;
          return {
            t: t,
            open: open,
            expanded: open ? "true" : "false",
            openPop: function () { self.setState({ open: true }); },
            closePop: function () { self.setState({ open: false }); },
            chips: ["Fourier properties", "Trig identities", "Units and constants"].map(function (label, i) {
              var on = i === sheet;
              return { label: label, selected: on ? "true" : "false", pick: function () { self.setState({ sheet: i }); }, style: "font: inherit; font-size: 0.88em; white-space: nowrap; font-weight: " + (on ? 700 : 500) + "; min-height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; border: " + (on ? "2px solid " + t.accent : "1px solid " + t.line) + "; background: " + (on ? t.surface : t.card) + "; color: " + (on ? t.text : t.muted) };
            }),
            rows: [
              { p: "Linearity", x: "a x(t) + b y(t)", X: "a X(ω) + b Y(ω)", n: "a, b constants" },
              { p: "Time shift", x: "x(t − t₀)", X: "e^(−jωt₀) X(ω)", n: "linear phase" },
              { p: "Scaling", x: "x(at)", X: "(1/|a|) X(ω/a)", n: "a ≠ 0" },
              { p: "Convolution", x: "x(t) ∗ y(t)", X: "X(ω) Y(ω)", n: "through H(ω)" }
            ],
            rootStyle: "position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: " + t.bg + "; color: " + t.text + "; font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-size: 16px; line-height: 1.55",
            wholeRow: "display: flex; flex-direction: column; padding: 12px 16px; border-radius: 10px; background: " + t.infoWash + "; border: 2px solid " + t.accent,
            startBtn: "font: inherit; font-size: 1.05em; font-weight: 700; min-height: 52px; border-radius: 10px; cursor: pointer; border: 1px solid " + t.accent + "; background: " + t.accent + "; color: " + t.onAccent,
            secondaryBtn: btn,
            secondaryBtnSmall: btn + "; padding: 0 14px",
            sheetStyle: "position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: " + t.card,
            fade: "position: absolute; top: 0; right: 0; bottom: 6px; width: 32px; pointer-events: none; background: linear-gradient(to right, transparent, " + t.card + ")",
            table: "min-width: 560px; border-collapse: separate; border-spacing: 0; font-size: 0.86em; border-top: 1px solid " + t.lineStrong + "; border-left: " + line,
            th: "text-align: left; font-weight: 700; padding: 6px 10px; white-space: nowrap; background: " + t.surface + "; border-right: " + line + "; border-bottom: 1px solid " + t.lineStrong,
            td: "padding: 6px 10px; vertical-align: top; border-right: " + line + "; border-bottom: " + line,
            tdMath: "padding: 6px 10px; vertical-align: top; white-space: nowrap; font-family: " + MATH + "; border-right: " + line + "; border-bottom: " + line
          };
        }
      }
    </script>
  </body>
</html>
